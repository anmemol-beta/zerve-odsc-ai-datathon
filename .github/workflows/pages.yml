name: Build frontend → publish to GitHub Releases for Zerve fetch

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build static export (same-origin)
        env:
          NEXT_PUBLIC_API_URL: ""
        run: npm run build
      - name: Pack web/out + dist/ → web-dist.tar.gz
        run: |
          rm -rf /tmp/bundle
          mkdir -p /tmp/bundle
          cp -r out/. /tmp/bundle/
          if [ -d ../dist ]; then
            echo "including dist/ (offline fallback bundle)"
            cp -r ../dist /tmp/bundle/dist
          else
            echo "no dist/ at repo root — tarball will not contain offline fallbacks"
          fi
          tar -czf web-dist.tar.gz -C /tmp/bundle .
          ls -lh web-dist.tar.gz
      - name: Publish to GitHub Releases (rolling tag = web-dist)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-dist
          name: Frontend bundle (latest)
          body: |
            Auto-built static export of `web/`.

            Asset URL:
            `https://github.com/${{ github.repository }}/releases/download/web-dist/web-dist.tar.gz`

            Refresh on the Zerve deployment without restart:
            `curl -X POST https://beta-zerve.hub.zerve.cloud/admin/refresh`
          files: web/web-dist.tar.gz
          make_latest: "true"
